<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Mapa de Intervenções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--panel:#fbfaf7;--line:#dcd7cc;--ink:#1d1f22;--ink-2:#5c5f66;--accent:#e8620c;--accent-ink:#fff;--bad:#c62828;--bad-soft:#fbe0de}
@media (prefers-color-scheme: dark){:root{--bg:#121417;--panel:#181b1f;--line:#2c3138;--ink:#e9e7e2;--ink-2:#a9adb4;--accent:#ff7a1a;--accent-ink:#111;--bad:#ff5a4e;--bad-soft:#3b1d1b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;padding:24px 16px}
main{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:9px}
h1::before{content:"";width:11px;height:11px;border-radius:2px;background:var(--accent)}
p{margin:0 0 20px;color:var(--ink-2);font-size:13.5px}
label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:14px}
input{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 15px inherit;font-family:inherit;cursor:pointer;margin-top:4px}
.erro{background:var(--bad-soft);color:var(--bad);padding:9px 11px;border-radius:8px;font-size:13.5px;margin-bottom:14px}
</style>
</head>
<body>
<main>
  <h1>Mapa de Intervenções</h1>
  <p>Entre com a conta autorizada pelo administrador.</p>
  {% if erro %}<div class="erro" role="alert">{{ erro }}</div>{% endif %}
  <form method="post" action="{{ url_for('rotas.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="proximo" value="{{ proximo }}">
    <label>E-mail<input type="email" name="email" id="email" autocomplete="username" required autofocus></label>
    <label>Senha<input type="password" name="senha" id="senha" autocomplete="current-password" required></label>
    <button type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
