# Render Blueprint — dois ambientes a partir do mesmo repositório.
#   produção     ← branch main     (disco persistente, cópia diária automática)
#   homologação  ← branch develop  (gratuito, sem disco: os dados de teste somem a cada atualização)
# Os dois só atualizam quando os testes do GitHub (CI) passarem.
services:
  - type: web
    name: mapa-intervencoes
    runtime: docker
    plan: 0.5c-512mb          # "Starter": 0,5 CPU, 512 MB — US$ 7/mês
    region: virginia          # região mais próxima do Brasil oferecida pela Render
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /saude
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 10              # US$ 0,25/GB/mês; pode aumentar depois, nunca diminuir
    envVars:
      - key: MAPA_SECRET_KEY
        generateValue: true
      - key: MAPA_ADMIN_EMAIL
        sync: false
      - key: MAPA_ADMIN_SENHA_INICIAL
        sync: false
      - key: MAPA_WORKER_THREADS
        value: "1"
      - key: MAPA_AMBIENTE
        value: producao

  - type: web
    name: mapa-intervencoes-homolog
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    autoDeployTrigger: checksPass
    healthCheckPath: /saude
    envVars:
      - key: MAPA_DADOS_DIR
        value: /tmp/instancia
      - key: MAPA_SECRET_KEY
        generateValue: true
      - key: MAPA_ADMIN_EMAIL
        sync: false
      - key: MAPA_ADMIN_SENHA_INICIAL
        sync: false
      - key: MAPA_WORKER_THREADS
        value: "1"
      - key: MAPA_MAX_ZIP_MB
        value: "200"
      - key: MAPA_AMBIENTE
        value: homologacao
